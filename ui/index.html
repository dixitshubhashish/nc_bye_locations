<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Competitive Whitespace Tool</title>
  <script src="constants.js"></script>
  <link id="appFavicon" rel="icon" type="image/png">
  <script>document.getElementById("appFavicon").href = window.APP_CONSTANTS.birdeyeFaviconUrl;</script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f8fc;
      color: #1f2937;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(92vw, 520px);
      padding: 36px;
      border: 1px solid #d8e2ef;
      border-top: 4px solid #0b70f0;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 18px 48px rgba(16, 29, 59, 0.12);
      text-align: center;
    }
    img {
      width: min(240px, 80%);
      height: auto;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 24px;
      color: #607080;
      line-height: 1.5;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 6px;
      background: #0b70f0;
      color: #ffffff;
      font-weight: 800;
      text-decoration: none;
    }
    a:hover { background: #095ecb; }
  </style>
</head>
<body>
  <main>
    <img data-logo-src="birdeyeLogoUrl" alt="Birdeye">
    <h1 data-product-name></h1>
    <p>Next-generation no-code platform with AI-assisted mapping, validation, and market insights.</p>
    <a href="/login">Go to Login</a>
  </main>
  <script>
    // Fall back to an inline SVG wordmark if the external CDN logo can't be
    // reached (offline, blocked, or 404) - otherwise this landing page shows
    // a broken image. Mirrors the fallback the main app already uses.
    (function () {
      var fallback = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60"><rect width="240" height="60" fill="none"/><g transform="translate(10, 10)"><path d="M 6 22 C 6 8 18 3 24 3 C 30 3 42 8 42 22 C 42 36 30 41 24 41 C 18 41 6 36 6 22 Z" fill="#0b70f0"/><ellipse cx="24" cy="22" rx="10" ry="10" fill="#ffffff"/><circle cx="24" cy="22" r="5" fill="#1d2b4f"/><path d="M 2 22 C 14 36 34 36 46 22 C 34 8 14 8 2 22 Z" fill="none" stroke="#0b70f0" stroke-width="3" stroke-linecap="round"/><text x="56" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#1d2b4f">Birdeye</text></g></svg>');
      var img = document.querySelector("[data-logo-src]");
      if (img) {
        img.onerror = function () { img.onerror = null; img.src = fallback; };
        img.src = window.APP_CONSTANTS.birdeyeLogoUrl || fallback;
      }
    })();
  </script>
</body>
</html>
