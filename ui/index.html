<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Competitive Whitespace Tool</title>
  <script src="constants.js"></script>
  <link id="appFavicon" rel="icon" type="image/png">
  <script>document.getElementById("appFavicon").href = window.APP_CONSTANTS.birdeyeFaviconUrl;</script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f8fc;
      color: #101d3b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(92vw, 520px);
      padding: 36px;
      border: 1px solid #d8e2ef;
      border-top: 4px solid #0b70f0;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 18px 48px rgba(16, 29, 59, 0.12);
      text-align: center;
    }
    img {
      width: min(240px, 80%);
      height: auto;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 24px;
      color: #607080;
      line-height: 1.5;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 6px;
      background: #0b70f0;
      color: #ffffff;
      font-weight: 800;
      text-decoration: none;
    }
    a:hover { background: #095ecb; }
  </style>
</head>
<body>
  <main>
    <img data-logo-src="birdeyeLogoUrl" alt="Birdeye">
    <h1>Competitive Whitespace Tool</h1>
    <p>Map source files, validate BigQuery, review rejected records, and inspect location gaps.</p>
    <a href="/integrations.html">Go to Whitespace Tool</a>
  </main>
  <script>
    document.querySelector("[data-logo-src]").src = window.APP_CONSTANTS.birdeyeLogoUrl;
  </script>
</body>
</html>
