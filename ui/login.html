<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Competitive Whitespace Tool Login</title>
  <script src="constants.js"></script>
  <link id="appFavicon" rel="icon" type="image/png">
  <script>document.getElementById("appFavicon").href = window.APP_CONSTANTS.birdeyeFaviconUrl;</script>
  <style>
    :root {
      --bg: #f5f8ff;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #667085;
      --line: #d9e2f1;
      --accent: #0b70f0;
      --error: #c43b54;
      --ok: #147d63;
      --warn: #a86412;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .login-box {
      width: min(420px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 16px 40px rgba(28, 51, 88, 0.1);
    }
    .brand-logo-image {
      display: block;
      width: auto;
      max-width: min(240px, 100%);
      max-height: 64px;
      object-fit: contain;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 22px;
      font-size: 26px;
      line-height: 1.2;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #cfd9e8;
      border-radius: 5px;
      font: inherit;
    }
    input:focus {
      outline: 2px solid rgba(23, 105, 255, 0.22);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      color: var(--ink);
    }
    .checkbox-row input { width: auto; }
    .login-box > button,
    .login-box > .button-row button {
      width: 100%;
      margin-top: 18px;
      padding: 10px 14px;
      border: 1px solid var(--accent);
      border-radius: 5px;
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .login-box > button:hover,
    .login-box > .button-row button:hover { background: #005fd3; }
    .login-box > button.secondary,
    .login-box > .button-row button.secondary {
      margin-top: 10px;
      border-color: var(--line);
      background: #ffffff;
      color: var(--ink);
    }
    .login-box > button.secondary:hover,
    .login-box > .button-row button.secondary:hover {
      border-color: var(--accent);
      background: #f4f8ff;
    }
    .login-box > button:disabled,
    .login-box > .button-row button:disabled {
      background: #aeb8c9;
      border-color: #aeb8c9;
      cursor: not-allowed;
    }
    .inline-spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spinCircle 0.8s linear infinite;
      vertical-align: -2px;
    }
    .busy-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    @keyframes spinCircle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #f8fbff;
      color: var(--muted);
      font-size: 13px;
    }
    .status.hidden { display: none; }
    .status.ok { border-color: #b7e0c6; background: #f1fbf7; color: var(--ok); }
    .status.error { border-color: #e4b3bf; background: #fff1f4; color: var(--error); }
    .status.warn { border-color: #f2d5a6; background: #fff8ed; color: var(--warn); }
    .status { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
    .status-message {
      flex: 1 1 auto;
      min-width: 0;
      overflow-wrap: break-word;
      word-break: normal;
      white-space: normal;
      line-height: 1.45;
    }
    .status-point { display: block; margin-top: 4px; }
    .status-close { flex: 0 0 auto; width: auto; min-width: 24px; margin: -2px 0 0 auto; border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 19px; line-height: 1; padding: 0 2px; opacity: .75; }
    .status-close:hover { opacity: 1; }
  </style>
</head>
<body>
  <main class="login-box">
    <img class="brand-logo-image" data-logo-src="birdeyeLogoDarkUrl" alt="Birdeye">
    <h1 data-product-name></h1>
    <label for="loginUser">Username</label>
    <input id="loginUser" autocomplete="username" value="admin">
    <label for="loginPassword">Password</label>
    <input id="loginPassword" type="password" autocomplete="current-password">
    <label class="checkbox-row" for="rememberLogin">
      <input id="rememberLogin" type="checkbox">
      Remember login
    </label>
    <button id="loginBtn" type="button">Login</button>
    <div id="loginStatus" class="status hidden"></div>
    <div id="loginReadinessStatus" class="status hidden"></div>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
