<!-- ========================================================================= -->
<!-- Location Intelligence Single-Page Application (ui/index.html)              -->
<!--                                                                           -->
<!-- Project default entry point. Acts as a lightweight, clean SPA shell with  -->
<!-- container slots into which domain subpackage HTML partials are injected    -->
<!-- asynchronously on page load (`ui/common/loader.js`).                      -->
<!-- ========================================================================= -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Location Intelligence</title>

  <!-- Application Favicon Setup -->
  <script src="common/constants.js"></script>
  <link id="appFavicon" rel="icon" type="image/png">
  <script>document.getElementById("appFavicon").href = window.APP_CONSTANTS.birdeyeFaviconUrl;</script>

  <!-- External Vendor Libraries (Monaco & Pyodide) -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.js"></script>
  
  <!-- Modular Subpackage Stylesheets -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="common/common.css">
  <link rel="stylesheet" href="auth/auth.css">
  <link rel="stylesheet" href="mapping/mapping.css">
  <link rel="stylesheet" href="review/review.css">
  <link rel="stylesheet" href="templates/templates.css">
  <link rel="stylesheet" href="system/system.css">
  <link rel="stylesheet" href="reporting/reporting.css">

  <!-- Monaco AMD Define Backup Shim for Leaflet and TopoJSON Vendor Scripts -->
  <script>
    window.__amdDefineBackup = window.define;
    window.define = undefined;
  </script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/topojson/topojson-client.min.js"></script>
  <script>
    window.define = window.__amdDefineBackup;
    delete window.__amdDefineBackup;
    if (!window.L && window.leaflet) window.L = window.leaflet;
  </script>
</head>
<body>
  <!-- Container Slots for Asynchronous Module Partials Injection -->
  <div id="commonModuleContainer"></div>
  <div id="authModuleContainer"></div>

  <!-- Authenticated Application Shell Container -->
  <div id="appShell" class="hidden">
    <div id="headerContainer"></div>
    <div id="mappingModuleContainer"></div>
    <div id="reportingModuleContainer"></div>
    <div id="reviewModuleContainer"></div>
    <div id="templatesModuleContainer"></div>
    <div id="footerContainer"></div>
  </div>

  <div id="systemModuleContainer"></div>

  <!-- Modular Subpackage Scripts -->
  <script src="common/common.js"></script>
  <script src="auth/auth.js"></script>
  <script src="system/system.js"></script>
  <script src="reporting/reporting.core.js"></script>
  <script src="reporting/reporting.tabs.js"></script>
  <script src="review/review.js"></script>
  <script src="templates/templates.js"></script>
  <script src="mapping/mapping.js"></script>
  <script src="reporting/reporting.wiring.js"></script>

  <!-- Modular UI Partial Component Loader & App Event Initializer -->
  <script src="common/loader.js"></script>
</body>
</html>
