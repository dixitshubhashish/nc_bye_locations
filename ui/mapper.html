<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand Source Mapper</title>
  <style>
    :root {
      --bg: #f6f7f4;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #607080;
      --line: #d8ded8;
      --accent: #24786d;
      --accent-ink: #ffffff;
      --warn: #9a5b13;
      --error: #a52626;
      --ok: #246b3d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: #ffffff;
      padding: 18px 24px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    main {
      display: grid;
      grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
      min-height: calc(100vh - 70px);
    }

    aside {
      border-right: 1px solid var(--line);
      background: #fbfcfa;
      padding: 20px;
    }

    section {
      padding: 20px 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      margin: 12px 0 6px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      padding: 9px 10px;
    }

    textarea {
      min-height: 230px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 6px;
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 9px 12px;
    }

    button.secondary {
      background: #ffffff;
      color: var(--ink);
      border-color: var(--line);
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .mapping-grid {
      display: grid;
      grid-template-columns: minmax(160px, 220px) minmax(220px, 1fr) minmax(180px, 260px);
      gap: 8px;
      align-items: center;
    }

    .mapping-head {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding-bottom: 4px;
    }

    .required {
      color: var(--error);
      font-weight: 800;
    }

    .status {
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
    }

    .status.ok { color: var(--ok); border-color: #b9d6c3; background: #f2fbf5; }
    .status.warn { color: var(--warn); border-color: #e5cfaa; background: #fff9ed; }
    .status.error { color: var(--error); border-color: #e8bbbb; background: #fff5f5; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      font-size: 12px;
      max-width: 260px;
      overflow-wrap: anywhere;
    }

    th {
      background: #eef3ef;
      color: #334155;
      font-weight: 750;
    }

    tr:last-child td { border-bottom: 0; }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .tab {
      background: #ffffff;
      color: var(--ink);
      border-color: var(--line);
    }

    .tab.active {
      background: var(--ink);
      color: #ffffff;
    }

    .hidden { display: none !important; }

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-box {
      width: min(420px, 100%);
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px;
    }

    .field-group.hidden { display: none; }

    .source-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: end;
      margin-top: 8px;
    }

    .source-row button {
      min-width: 40px;
      padding: 9px 10px;
    }

    .source-row label {
      margin-top: 0;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .mapping-grid { grid-template-columns: 1fr; }
      .mapping-head { display: none; }
      .source-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h1>Brand Source Mapper</h1>
      <label for="loginUser">Username</label>
      <input id="loginUser" autocomplete="username" value="admin">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password">
      <div class="button-row">
        <button id="loginBtn">Login</button>
      </div>
      <div id="loginStatus" class="status hidden"></div>
    </div>
  </div>

  <div id="appShell" class="hidden">
    <header>
      <h1>Brand Source Mapper</h1>
    </header>
    <main>
    <aside>
      <div class="panel">
        <h2>Source</h2>
        <label for="sourceType">Source format</label>
        <select id="sourceType">
          <option value="csv">CSV</option>
          <option value="excel">Excel (.xlsx)</option>
          <option value="json">JSON</option>
          <option value="xml">XML</option>
          <option value="api_get_json">GET API JSON</option>
        </select>

        <label for="brandName">Brand name</label>
        <input id="brandName" placeholder="Example: Papa Johns">

        <label for="sourceName">Source name</label>
        <input id="sourceName" placeholder="Example: papa_johns_locator_api">

        <div class="field-group record-field">
        <label for="recordPath">Record path</label>
        <input id="recordPath" placeholder="JSON: stores or data.locations; Excel: sheet1">
        </div>

        <div class="field-group excel-field">
        <label for="sheetName">Excel sheet</label>
        <select id="sheetName" disabled>
          <option value="">Upload Excel to load sheets</option>
        </select>
        </div>

        <div class="field-group api-field">
        <label for="apiUrl">GET API URL</label>
        <input id="apiUrl" placeholder="https://example.com/stores.json">

        <label>Query parameters</label>
        <div id="queryParams"></div>
        <button class="secondary" id="addQueryParamBtn" type="button">Add Param</button>

        <label for="authType">Authentication</label>
        <select id="authType">
          <option value="none">None</option>
          <option value="bearer">Bearer token</option>
          <option value="basic">Basic username/password</option>
          <option value="api_key_header">API key header</option>
        </select>

        <div class="field-group auth-field auth-bearer">
          <label for="bearerToken">Bearer token</label>
          <input id="bearerToken" type="password" placeholder="Token">
        </div>

        <div class="field-group auth-field auth-basic">
          <label for="basicUser">Basic username</label>
          <input id="basicUser" autocomplete="off" placeholder="Username">
          <label for="basicPassword">Basic password</label>
          <input id="basicPassword" type="password" autocomplete="off" placeholder="Password">
        </div>

        <div class="field-group auth-field auth-api-key">
          <label for="apiKeyName">API key header name</label>
          <input id="apiKeyName" placeholder="x-api-key">
          <label for="apiKeyValue">API key value</label>
          <input id="apiKeyValue" type="password" placeholder="Key">
        </div>

        <label>Custom headers</label>
        <div id="customHeaders"></div>
        <button class="secondary" id="addHeaderBtn" type="button">Add Header</button>
        </div>

        <div class="field-group file-field">
        <label for="fileInput">Upload source file</label>
        <input id="fileInput" type="file" accept=".csv,.xlsx,.xls,.json,.xml,application/json,text/csv,application/xml,text/xml">
        </div>

        <div class="button-row">
          <button id="parseBtn">Parse Source</button>
          <button class="secondary" id="resetBtn">Reset</button>
        </div>
      </div>

      <div class="panel">
        <h2>Mapper JSON</h2>
        <textarea id="mapperOutput" spellcheck="false"></textarea>
        <div class="button-row">
          <button id="downloadBtn">Download Mapper</button>
          <button class="secondary" id="copyBtn">Copy</button>
        </div>
      </div>
    </aside>

    <section>
      <div id="status" class="status">Upload a source file or enter a GET JSON API URL to begin.</div>

      <div class="panel">
        <h2>Internal Schema Mapping</h2>
        <div class="mapping-grid" id="mappingGrid"></div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="sourcePreview">Source Preview</button>
        <button class="tab" data-tab="normalizedPreview">Normalized Preview</button>
      </div>

      <div id="sourcePreview"></div>
      <div id="normalizedPreview" class="hidden"></div>
    </section>
    </main>
  </div>

  <script>
    const mappingTargets = [
      { key: "location_id", table: "restaurants", field: "location_key", label: "restaurants.location_key", required: false, hints: ["id", "storeid", "store_id", "locationid", "number"] },
      { key: "name", table: "restaurants", field: "name", label: "restaurants.name", required: false, hints: ["name", "storename", "displayname"] },
      { key: "address", table: "restaurants", field: "address", label: "restaurants.address", required: true, hints: ["address", "addressdescription", "line1", "street"] },
      { key: "city", table: "restaurants", field: "city_name", label: "restaurants.city_name", required: true, hints: ["city", "town"] },
      { key: "state", table: "restaurants", field: "state_code", label: "restaurants.state_code", required: true, hints: ["state", "region", "province", "state_code"] },
      { key: "postal_code", table: "restaurants", field: "zip_code", label: "restaurants.zip_code", required: true, hints: ["zip", "zipcode", "zip_code", "postalcode", "postal_code"] },
      { key: "latitude", table: "restaurants", field: "latitude", label: "restaurants.latitude", required: false, hints: ["lat", "latitude"] },
      { key: "longitude", table: "restaurants", field: "longitude", label: "restaurants.longitude", required: false, hints: ["lng", "lon", "longitude"] },
      { key: "observed_at", table: "source_observations", field: "observed_at", label: "source_observations.observed_at", required: false, hints: ["observed_at", "updatedat", "updated_at", "last_seen"] }
    ];

    let sourceRows = [];
    let sourceFields = [];
    let resolvedRecordPath = "";

    const el = (id) => document.getElementById(id);

    function normalizeName(value) {
      return String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function flattenObject(value, prefix = "", output = {}) {
      if (value && typeof value === "object" && !Array.isArray(value)) {
        Object.entries(value).forEach(([key, child]) => {
          const path = prefix ? `${prefix}.${key}` : key;
          flattenObject(child, path, output);
        });
      } else {
        output[prefix] = value;
      }
      return output;
    }

    function getByPath(row, path) {
      if (!path) return "";
      return path.split(".").reduce((current, part) => {
        if (current && typeof current === "object" && part in current) return current[part];
        return "";
      }, row);
    }

    function setStatus(message, type = "") {
      el("status").className = `status ${type}`;
      el("status").textContent = message;
    }

    function inferSourceType(fileName) {
      const lower = fileName.toLowerCase();
      if (lower.endsWith(".xlsx") || lower.endsWith(".xls")) return "excel";
      if (lower.endsWith(".json")) return "json";
      if (lower.endsWith(".xml")) return "xml";
      return "csv";
    }

    function isExcelFile(file) {
      if (!file) return false;
      const lower = file.name.toLowerCase();
      return lower.endsWith(".xlsx") || lower.endsWith(".xls");
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",", 2)[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function addPairRow(targetId, keyPlaceholder, valuePlaceholder, key = "", value = "") {
      const row = document.createElement("div");
      row.className = "source-row";
      row.innerHTML = `
        <div>
          <label>Key</label>
          <input data-pair-key placeholder="${escapeHtml(keyPlaceholder)}" value="${escapeHtml(key)}">
        </div>
        <div>
          <label>Value</label>
          <input data-pair-value placeholder="${escapeHtml(valuePlaceholder)}" value="${escapeHtml(value)}">
        </div>
        <button class="secondary" type="button" title="Remove">X</button>
      `;
      row.querySelector("button").addEventListener("click", () => row.remove());
      el(targetId).appendChild(row);
    }

    function collectPairs(targetId) {
      return Array.from(el(targetId).querySelectorAll(".source-row"))
        .map((row) => ({
          key: row.querySelector("[data-pair-key]").value.trim(),
          value: row.querySelector("[data-pair-value]").value.trim()
        }))
        .filter((pair) => pair.key);
    }

    function collectAuth() {
      const type = el("authType").value;
      if (type === "bearer") {
        return { type, token: el("bearerToken").value.trim() };
      }
      if (type === "basic") {
        return { type, username: el("basicUser").value, password: el("basicPassword").value };
      }
      if (type === "api_key_header") {
        return { type, key_name: el("apiKeyName").value.trim(), key_value: el("apiKeyValue").value.trim() };
      }
      return { type: "none" };
    }

    function updateAuthVisibility() {
      const authType = el("authType").value;
      document.querySelectorAll(".auth-field").forEach((field) => field.classList.add("hidden"));
      if (authType === "bearer") document.querySelector(".auth-bearer").classList.remove("hidden");
      if (authType === "basic") document.querySelector(".auth-basic").classList.remove("hidden");
      if (authType === "api_key_header") document.querySelector(".auth-api-key").classList.remove("hidden");
    }

    function updateSourceVisibility() {
      const sourceType = el("sourceType").value;
      const isApi = sourceType === "api_get_json";
      const isExcel = sourceType === "excel";
      const hasRecordPath = ["json", "xml", "api_get_json"].includes(sourceType);

      document.querySelectorAll(".api-field").forEach((field) => field.classList.toggle("hidden", !isApi));
      document.querySelectorAll(".excel-field").forEach((field) => field.classList.toggle("hidden", !isExcel));
      document.querySelectorAll(".file-field").forEach((field) => field.classList.toggle("hidden", isApi));
      document.querySelectorAll(".record-field").forEach((field) => field.classList.toggle("hidden", !hasRecordPath));

      el("fileInput").disabled = isApi;
      el("apiUrl").disabled = !isApi;
      el("sheetName").disabled = !isExcel || !el("sheetName").options.length;
      updateAuthVisibility();
    }

    function login() {
      const ok = el("loginUser").value.trim() === "admin" && el("loginPassword").value.trim() === "birdeye";
      if (!ok) {
        el("loginStatus").className = "status error";
        el("loginStatus").textContent = "Invalid username or password.";
        return;
      }
      el("loginScreen").classList.add("hidden");
      el("appShell").classList.remove("hidden");
    }

    function suggestField(target) {
      const normalizedFields = sourceFields.map((field) => ({ field, clean: normalizeName(field) }));
      for (const hint of target.hints) {
        const exact = normalizedFields.find((entry) => entry.clean === normalizeName(hint));
        if (exact) return exact.field;
      }
      for (const hint of target.hints) {
        const cleanHint = normalizeName(hint);
        const partial = normalizedFields.find((entry) => entry.clean.includes(cleanHint) || cleanHint.includes(entry.clean));
        if (partial) return partial.field;
      }
      return "";
    }

    function sampleValue(path) {
      for (const row of sourceRows.slice(0, 10)) {
        const value = getByPath(row, path);
        if (value !== undefined && value !== null && value !== "") return String(value);
      }
      return "";
    }

    function renderMappings() {
      const grid = el("mappingGrid");
      grid.innerHTML = `
        <div class="mapping-head">BigQuery target field</div>
        <div class="mapping-head">Source field path</div>
        <div class="mapping-head">Sample value</div>
      `;
      mappingTargets.forEach((target) => {
        const selected = suggestField(target);
        const options = ['<option value="">Not mapped</option>']
          .concat(sourceFields.map((sourceField) => `<option value="${escapeHtml(sourceField)}">${escapeHtml(sourceField)}</option>`))
          .join("");
        grid.insertAdjacentHTML("beforeend", `
          <div>${target.label} ${target.required ? '<span class="required">*</span>' : ''}</div>
          <select data-field="${target.key}">${options}</select>
          <div data-sample="${target.key}">${escapeHtml(selected ? sampleValue(selected) : "")}</div>
        `);
        grid.querySelector(`select[data-field="${target.key}"]`).value = selected;
      });
      grid.querySelectorAll("select").forEach((select) => {
        select.addEventListener("change", () => {
          const key = select.dataset.field;
          grid.querySelector(`[data-sample="${key}"]`).textContent = sampleValue(select.value);
          updateOutput();
        });
      });
      updateOutput();
    }

    function getMapper() {
      const fields = {};
      document.querySelectorAll("select[data-field]").forEach((select) => {
        if (select.value) fields[select.dataset.field] = select.value;
      });
      const mapper = {
        brand: el("brandName").value.trim(),
        source_name: el("sourceName").value.trim(),
        source_type: el("sourceType").value,
        fields
      };
      const recordPath = el("recordPath").value.trim() || resolvedRecordPath;
      if (recordPath && ["json", "xml", "excel", "api_get_json"].includes(el("sourceType").value)) {
        mapper.record_path = recordPath;
      }
      if (el("sourceType").value === "api_get_json") {
        mapper.api_request = {
          method: "GET",
          url: el("apiUrl").value.trim(),
          query_params: collectPairs("queryParams"),
          headers: collectPairs("customHeaders"),
          auth: collectAuth()
        };
      }
      return mapper;
    }

    function normalizedRows() {
      const mapper = getMapper();
      return sourceRows.slice(0, 10).map((row, index) => {
        const out = { brand: mapper.brand };
        mappingTargets.forEach((target) => {
          const path = mapper.fields[target.key];
          out[`${target.table}.${target.field}`] = path ? getByPath(row, path) : "";
        });
        if (!out["restaurants.location_key"]) {
          out["restaurants.location_key"] = `${normalizeName(mapper.brand) || "brand"}:${out["restaurants.zip_code"] || "zip"}:${index + 1}`;
        }
        return out;
      });
    }

    function validateMapper(mapper) {
      const missing = mappingTargets.filter((target) => target.required && !mapper.fields[target.key]).map((target) => target.label);
      if (!mapper.brand) missing.unshift("brand");
      if (missing.length) {
        setStatus(`Missing required mapping: ${missing.join(", ")}`, "warn");
      } else {
        setStatus(`Parsed ${sourceRows.length} records with ${sourceFields.length} source fields.`, "ok");
      }
    }

    function updateOutput() {
      const mapper = getMapper();
      el("mapperOutput").value = JSON.stringify(mapper, null, 2);
      validateMapper(mapper);
      renderTable("normalizedPreview", normalizedRows());
    }

    function renderTable(targetId, rows) {
      const target = el(targetId);
      if (!rows.length) {
        target.innerHTML = "";
        return;
      }
      const columns = Object.keys(flattenObject(rows[0]));
      const body = rows.map((row) => {
        const flat = flattenObject(row);
        return `<tr>${columns.map((col) => `<td>${escapeHtml(flat[col] ?? "")}</td>`).join("")}</tr>`;
      }).join("");
      target.innerHTML = `
        <table>
          <thead><tr>${columns.map((col) => `<th>${escapeHtml(col)}</th>`).join("")}</tr></thead>
          <tbody>${body}</tbody>
        </table>
      `;
    }

    async function parseSource() {
      setStatus("Parsing source in Python backend...", "");
      try {
        const file = el("fileInput").files[0];
        let sourceType = el("sourceType").value;
        const payload = {
          source_type: sourceType,
          record_path: el("recordPath").value.trim()
        };
        if (sourceType === "api_get_json") {
          if (!el("apiUrl").value.trim()) throw new Error("Enter a GET API URL.");
          payload.api_url = el("apiUrl").value.trim();
          payload.query_params = collectPairs("queryParams");
          payload.headers = Object.fromEntries(collectPairs("customHeaders").map((pair) => [pair.key, pair.value]));
          payload.auth = collectAuth();
        } else {
          if (!file) throw new Error("Choose a source file.");
          sourceType = inferSourceType(file.name);
          el("sourceType").value = sourceType;
          payload.source_type = sourceType;
          payload.file_name = file.name;
          payload.content_base64 = await fileToBase64(file);
          if (sourceType === "excel" && el("sheetName").value) {
            payload.record_path = el("sheetName").value;
          }
        }
        const response = await fetch("/api/preview", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Preview failed.");
        sourceRows = result.rows || [];
        sourceFields = result.fields || [];
        resolvedRecordPath = result.record_path || "";
        if (resolvedRecordPath && !el("recordPath").value.trim()) el("recordPath").value = resolvedRecordPath;
        if (sourceType === "excel" && resolvedRecordPath) el("sheetName").value = resolvedRecordPath;
        renderMappings();
        renderTable("sourcePreview", sourceRows.slice(0, 10).map((row) => flattenObject(row)));
      } catch (error) {
        sourceRows = [];
        sourceFields = [];
        setStatus(error.message, "error");
      }
    }

    async function loadExcelSheets() {
      const file = el("fileInput").files[0];
      el("sheetName").innerHTML = '<option value="">Upload Excel to load sheets</option>';
      el("sheetName").disabled = true;
      if (!isExcelFile(file)) return;
      try {
        const payload = {
          file_name: file.name,
          content_base64: await fileToBase64(file)
        };
        const response = await fetch("/api/sheets", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Could not load sheets.");
        const sheets = result.sheets || [];
        el("sheetName").innerHTML = sheets.map((sheet) => `<option value="${escapeHtml(sheet)}">${escapeHtml(sheet)}</option>`).join("");
        el("sheetName").disabled = sheets.length === 0;
        if (sheets.length) {
          el("recordPath").value = sheets[0];
          setStatus(`Loaded ${sheets.length} Excel sheet${sheets.length === 1 ? "" : "s"}.`, "ok");
        }
      } catch (error) {
        setStatus(error.message, "error");
      }
    }

    function downloadMapper() {
      const brand = normalizeName(el("brandName").value) || "brand";
      const blob = new Blob([el("mapperOutput").value + "\n"], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `${brand}_mapper.json`;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    el("parseBtn").addEventListener("click", parseSource);
    el("loginBtn").addEventListener("click", login);
    el("loginPassword").addEventListener("keydown", (event) => {
      if (event.key === "Enter") login();
    });
    el("addQueryParamBtn").addEventListener("click", () => addPairRow("queryParams", "zip", "10001"));
    el("addHeaderBtn").addEventListener("click", () => addPairRow("customHeaders", "x-client-id", "value"));
    el("authType").addEventListener("change", updateAuthVisibility);
    el("downloadBtn").addEventListener("click", downloadMapper);
    el("copyBtn").addEventListener("click", () => navigator.clipboard.writeText(el("mapperOutput").value));
    el("resetBtn").addEventListener("click", () => location.reload());
    el("brandName").addEventListener("input", updateOutput);
    el("sourceName").addEventListener("input", updateOutput);
    el("fileInput").addEventListener("change", () => {
      const file = el("fileInput").files[0];
      if (file) el("sourceType").value = inferSourceType(file.name);
      el("sourceType").dispatchEvent(new Event("change"));
      loadExcelSheets();
    });
    el("sheetName").addEventListener("change", () => {
      el("recordPath").value = el("sheetName").value;
    });
    el("sourceType").addEventListener("change", updateSourceVisibility);
    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((tab) => tab.classList.remove("active"));
        button.classList.add("active");
        ["sourcePreview", "normalizedPreview"].forEach((id) => el(id).classList.toggle("hidden", id !== button.dataset.tab));
      });
    });
    addPairRow("queryParams", "limit", "100");
    addPairRow("customHeaders", "Accept", "application/json");
    updateSourceVisibility();
  </script>
</body>
</html>
