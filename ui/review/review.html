<!-- ========================================================================= -->
<!-- Review Records UI Module Partial (ui/review/review.html)                   -->
<!--                                                                           -->
<!-- Provides the rejected records review dashboard, including event ID search  -->
<!-- toolbar, error listing table, and the edit & retry record modal dialog.   -->
<!-- ========================================================================= -->

<!-- Review Error Listings View Container -->
<section id="reviewView" class="review-view hidden">
  <h2>Review Records</h2>
  <p style="color: var(--muted); font-size: 13px; margin-top: -8px; margin-bottom: 16px;">
    Review records that need attention. Edit and retry when ready.
  </p>

  <!-- Review Records Search Toolbar -->
  <div class="review-toolbar">
    <input id="reviewEventId" placeholder="Search by event ID (leave empty for all records)">
    <button id="reviewSearchBtn" type="button">Search Records</button>
  </div>

  <!-- Error Distribution by Brand Breakdown -->
  <div id="reviewBrandBreakdown" class="review-brand-breakdown" style="display: none; margin: 8px 0 18px; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: #fff;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px;">
      <strong style="font-size: 13px; color: var(--ink);">Error Distribution by Brand</strong>
      <span id="reviewBrandBreakdownTotal" style="font-size: 12px; color: var(--muted);"></span>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; max-width: 900px;">
      <div id="reviewBrandChart" style="display: flex; justify-content: center; min-height: 200px;"></div>
      <div id="reviewBrandTable" style="overflow-x: auto; min-height: 200px;"></div>
    </div>
  </div>

  <!-- Review Search Results Table / Status -->
  <div id="reviewResults" class="status">Search review records.</div>
</section>

<!-- Edit & Retry Record Modal Dialog -->
<dialog id="editRecordDialog" class="connector-editor-dialog" style="max-width: 700px; height: auto; max-height: 90vh;">
  <div class="connector-editor-dialog-content" style="display: flex; flex-direction: column; overflow: hidden; padding: 24px;">
    <!-- Dialog Header -->
    <div class="connector-editor-dialog-header">
      <h2 class="connector-editor-dialog-title">Edit Record</h2>
      <button class="secondary" id="closeEditRecordBtn" type="button">✕ Close</button>
    </div>

    <!-- Error Correction Guidance Hints -->
    <div id="editRecordHints" style="background: #fff8e6; border: 1px solid #ffe58f; border-radius: 6px; padding: 12px; font-size: 13px; color: #8c6b00; margin-bottom: 16px;"></div>
    <div id="editRecordFeedback" class="action-feedback" style="margin-bottom: 16px; display: none;"></div>

    <!-- Dynamic Record Edit Fields Grid -->
    <div id="editRecordForm" style="flex: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; padding-right: 4px;"></div>

    <!-- Record Submission Actions -->
    <div class="button-row" style="margin-top: 12px;">
      <button id="submitEditRecordBtn" type="button">Retry Record</button>
      <button class="secondary" id="cancelEditRecordBtn" type="button">Cancel</button>
    </div>
  </div>
</dialog>
